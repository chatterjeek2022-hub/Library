<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Personal Library</title>

<link rel="apple-touch-icon" href="library_app_icon.png">
<link rel="icon" type="image/png" href="library_app_icon.png">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

<style>
body{
background:linear-gradient(to bottom right,#fff7ed,#fef3c7);
font-family:Arial,sans-serif;
}
.card{
background:white;
border-radius:24px;
padding:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}
.input{
width:100%;
padding:12px;
border-radius:16px;
border:1px solid #fed7aa;
}
.label{
display:block;
font-weight:bold;
margin-bottom:6px;
color:#7c2d12;
}
</style>
</head>

<body class="p-5 min-h-screen">

<div class="max-w-7xl mx-auto">

<div class="card mb-6">
<h1 class="text-4xl font-bold text-orange-900">📚 Ultimate Personal Library</h1>
<p class="text-gray-600 mt-2">
Barcode Scanner • Metadata Autofetch • OCR • Dashboard • Edit/Delete
</p>
</div>

<!-- DASHBOARD -->

<div class="grid md:grid-cols-3 gap-5 mb-6">

<div onclick="openSection('all')" class="card cursor-pointer border-l-8 border-orange-500">
<div class="text-gray-500">Total Books</div>
<div id="totalBooks" class="text-5xl font-bold text-orange-900 mt-3">0</div>
</div>

<div onclick="openSection('lent')" class="card cursor-pointer border-l-8 border-yellow-500">
<div class="text-gray-500">Lent Books</div>
<div id="lentBooks" class="text-5xl font-bold text-yellow-700 mt-3">0</div>
</div>

<div onclick="openSection('borrowed')" class="card cursor-pointer border-l-8 border-blue-500">
<div class="text-gray-500">Borrowed Books</div>
<div id="borrowedBooks" class="text-5xl font-bold text-blue-700 mt-3">0</div>
</div>

</div>

<div id="sectionView" class="mb-6 hidden"></div>

<div class="grid lg:grid-cols-2 gap-6">

<!-- LEFT -->

<div class="card">

<h2 class="text-2xl font-bold text-orange-900 mb-5">
Add / Edit Book
</h2>

<div class="space-y-4">

<div>
<label class="label">ISBN / Barcode</label>

<div class="flex gap-3">

<input id="isbn" class="input">

<button onclick="startScanner()" class="bg-black text-white px-5 rounded-2xl">
📷
</button>

</div>

</div>

<div id="reader"></div>

<button onclick="fetchBookDetails()"
class="bg-blue-700 text-white rounded-2xl p-4 w-full font-bold">
Auto Fetch Metadata
</button>

<div>
<label class="label">Book Title</label>
<input id="title" class="input">
</div>

<div>
<label class="label">Author</label>
<input id="author" class="input">
</div>

<div class="grid md:grid-cols-2 gap-4">

<div>
<label class="label">Pages</label>
<input id="pages" class="input">
</div>

<div>
<label class="label">Genre</label>
<input id="genre" class="input">
</div>

</div>

<div>
<label class="label">Description / Story Plot</label>
<textarea id="description" class="input h-40"></textarea>
</div>

<div class="bg-orange-50 rounded-2xl p-4">

<h3 class="font-bold text-orange-900 mb-3">
📷 OCR Story Extraction
</h3>

<input type="file"
id="ocrImage"
accept="image/*"
class="input"
onchange="loadOCRImage(event)">

<img id="ocrPreview" class="hidden mt-4 rounded-xl max-w-full">

<button onclick="extractOCRText()"
class="mt-4 bg-purple-700 text-white rounded-2xl p-4 w-full font-bold">

Crop & Extract Text

</button>

<div id="ocrStatus" class="mt-3 text-sm text-gray-600"></div>

</div>

<h3 class="text-xl font-bold text-orange-900">
📍 Location
</h3>

<div class="grid md:grid-cols-3 gap-4">

<input id="almirah" class="input" placeholder="Almirah">
<input id="shelf" class="input" placeholder="Shelf">

<select id="row" class="input">
<option>Front Row</option>
<option>Middle Row</option>
<option>Back Row</option>
</select>

</div>

<h3 class="text-xl font-bold text-orange-900">
🤝 Lending / Borrowing
</h3>

<div class="grid md:grid-cols-2 gap-4">

<input id="lentTo" class="input" placeholder="Lent To">
<input id="borrowedFrom" class="input" placeholder="Borrowed From">

</div>

<button onclick="addOrUpdateBook()"
class="bg-orange-600 text-white rounded-2xl p-4 w-full font-bold text-lg">

Save Book

</button>

</div>

</div>

<!-- RIGHT -->

<div>

<div class="card mb-5">

<label class="label">Search Library</label>

<input id="search"
oninput="renderBooks()"
class="input"
placeholder="Search books...">

<div class="flex gap-3 mt-4 flex-wrap">

<button onclick="exportBackup()"
class="bg-green-700 text-white px-4 py-3 rounded-xl font-bold">
Export Backup
</button>

<label class="bg-blue-700 text-white px-4 py-3 rounded-xl cursor-pointer font-bold">
Import Backup
<input type="file" hidden onchange="importBackup(event)">
</label>

</div>

</div>

<div id="booksGrid"></div>

</div>

</div>

</div>

<script>

let books = JSON.parse(localStorage.getItem('library_books') || '[]');
let editingIndex = -1;
let cropper = null;

function saveBooks(){
localStorage.setItem('library_books', JSON.stringify(books));
}

function updateDashboard(){

document.getElementById('totalBooks').innerText = books.length;

document.getElementById('lentBooks').innerText =
books.filter(b=>b.lentTo).length;

document.getElementById('borrowedBooks').innerText =
books.filter(b=>b.borrowedFrom).length;

}

function openSection(type){

let filtered = [];

if(type === 'all'){
filtered = books;
}

if(type === 'lent'){
filtered = books.filter(b=>b.lentTo);
}

if(type === 'borrowed'){
filtered = books.filter(b=>b.borrowedFrom);
}

const section = document.getElementById('sectionView');

section.classList.remove('hidden');

section.innerHTML = `

<div class="card">

<div class="flex justify-between items-center mb-4">

<h2 class="text-2xl font-bold">
${type.toUpperCase()} BOOKS
</h2>

<button onclick="closeSection()"
class="bg-red-600 text-white px-4 py-2 rounded-xl">
Close
</button>

</div>

<div class="space-y-3">

${filtered.map((book,index)=>`

<div class="bg-orange-50 rounded-2xl p-4">

<div class="font-bold text-lg">
${book.title}
</div>

<div class="text-gray-700">
${book.author || ''}
</div>

<div class="flex gap-3 mt-3">

<button onclick="editBook(${index})"
class="bg-blue-600 text-white px-4 py-2 rounded-xl">
Edit
</button>

<button onclick="deleteBook(${index})"
class="bg-red-600 text-white px-4 py-2 rounded-xl">
Delete
</button>

</div>

</div>

`).join('')}

</div>

</div>

`;

}

function closeSection(){
document.getElementById('sectionView').classList.add('hidden');
}

async function fetchBookDetails(){

const isbn =
document.getElementById('isbn')
.value
.replace(/[^0-9X]/gi,'')
.trim();

if(!isbn){
alert('Enter ISBN');
return;
}

try{

let response = await fetch(
'https://www.googleapis.com/books/v1/volumes?q=isbn:' + isbn
);

let data = await response.json();

if(data.items && data.items.length > 0){

const info = data.items[0].volumeInfo;

document.getElementById('title').value =
info.title || '';

document.getElementById('author').value =
info.authors ? info.authors.join(', ') : '';

document.getElementById('pages').value =
info.pageCount || '';

document.getElementById('genre').value =
info.categories ? info.categories[0] : '';

document.getElementById('description').value =
info.description || '';

alert('Metadata fetched successfully');

return;

}

response = await fetch(
'https://openlibrary.org/api/books?bibkeys=ISBN:' +
isbn +
'&jscmd=data&format=json'
);

const openData = await response.json();

const key = 'ISBN:' + isbn;

if(openData[key]){

const info = openData[key];

document.getElementById('title').value =
info.title || '';

document.getElementById('author').value =
info.authors
? info.authors.map(a=>a.name).join(', ')
: '';

document.getElementById('pages').value =
info.number_of_pages || '';

alert('Metadata fetched successfully');

return;

}

alert('No metadata found');

}catch(err){

console.error(err);

alert('Metadata fetch failed');

}

}

async function startScanner(){

document.getElementById('reader').innerHTML = '';

const scanner = new Html5Qrcode('reader');

try{

await scanner.start(
{ facingMode: "environment" },
{
fps: 60,
qrbox: { width: 300, height: 120 }
},

async(decodedText)=>{

document.getElementById('isbn').value =
decodedText;

await scanner.stop();

document.getElementById('reader').innerHTML = '';

fetchBookDetails();

},

()=>{}

);

}catch(err){

console.error(err);

alert('Scanner failed');

}

}

function loadOCRImage(event){

const file = event.target.files[0];

if(!file) return;

const image = document.getElementById('ocrPreview');

image.src = URL.createObjectURL(file);

image.classList.remove('hidden');

image.onload = ()=>{

if(cropper){
cropper.destroy();
}

cropper = new Cropper(image,{
viewMode:1,
autoCropArea:1,
cropBoxResizable:true,
cropBoxMovable:true
});

};

}

async function extractOCRText(){

if(!cropper){
alert('Select image first');
return;
}

document.getElementById('ocrStatus').innerText =
'Extracting text...';

try{

const canvas = cropper.getCroppedCanvas({
maxWidth:2000,
maxHeight:2000
});

const blob = await new Promise(resolve =>
canvas.toBlob(resolve)
);

const result =
await Tesseract.recognize(blob,'eng');

document.getElementById('description').value +=
'\n\n' + result.data.text;

document.getElementById('ocrStatus').innerText =
'Text extracted successfully';

}catch(err){

console.error(err);

document.getElementById('ocrStatus').innerText =
'OCR extraction failed';

}

}

function addOrUpdateBook(){

const title =
document.getElementById('title')
.value
.trim();

if(!title){
alert('Enter title');
return;
}

const bookData = {

id:
editingIndex >= 0
? books[editingIndex].id
: 'BK-' + Math.random().toString(36).substring(2,8).toUpperCase(),

isbn: document.getElementById('isbn').value,
title,
author: document.getElementById('author').value,
pages: document.getElementById('pages').value,
genre: document.getElementById('genre').value,
description: document.getElementById('description').value,
almirah: document.getElementById('almirah').value,
shelf: document.getElementById('shelf').value,
row: document.getElementById('row').value,
lentTo: document.getElementById('lentTo').value,
borrowedFrom: document.getElementById('borrowedFrom').value

};

if(editingIndex >= 0){

books[editingIndex] = bookData;

alert('Book updated');

}else{

books.unshift(bookData);

alert('Book added');

}

saveBooks();

renderBooks();

clearForm();

}

function editBook(index){

const book = books[index];

editingIndex = index;

document.getElementById('isbn').value = book.isbn || '';
document.getElementById('title').value = book.title || '';
document.getElementById('author').value = book.author || '';
document.getElementById('pages').value = book.pages || '';
document.getElementById('genre').value = book.genre || '';
document.getElementById('description').value = book.description || '';
document.getElementById('almirah').value = book.almirah || '';
document.getElementById('shelf').value = book.shelf || '';
document.getElementById('row').value = book.row || 'Front Row';
document.getElementById('lentTo').value = book.lentTo || '';
document.getElementById('borrowedFrom').value = book.borrowedFrom || '';

window.scrollTo({top:0,behavior:'smooth'});

}

function deleteBook(index){

if(!confirm('Delete this book?')) return;

books.splice(index,1);

saveBooks();

renderBooks();

closeSection();

}

function clearForm(){

document.querySelectorAll('input, textarea').forEach(el=>{

if(el.type !== 'file'){
el.value = '';
}

});

editingIndex = -1;

}

function renderBooks(){

const search =
document.getElementById('search')
.value
.toLowerCase();

const filtered = books.filter(book=>

(book.title || '')
.toLowerCase()
.includes(search)

||

(book.author || '')
.toLowerCase()
.includes(search)

);

document.getElementById('booksGrid').innerHTML =

filtered.map((book,index)=>`

<div class="card mb-4 border-l-8 border-orange-400">

<div class="text-xs text-gray-500">
${book.id}
</div>

<h2 class="text-2xl font-bold text-orange-900">
${book.title}
</h2>

<div class="text-gray-700">
${book.author || ''}
</div>

<div class="mt-3 space-y-2 text-sm">

<div>
<b>Pages:</b> ${book.pages || '-'}
</div>

<div>
<b>Location:</b>
${book.almirah || '-'} /
${book.shelf || '-'} /
${book.row || '-'}
</div>

${book.lentTo ? `
<div class="bg-yellow-100 p-3 rounded-2xl">
⚠ Lent To: ${book.lentTo}
</div>
` : ''}

${book.borrowedFrom ? `
<div class="bg-blue-100 p-3 rounded-2xl">
📘 Borrowed From: ${book.borrowedFrom}
</div>
` : ''}

</div>

<div class="flex gap-3 mt-4">

<button onclick="editBook(${index})"
class="bg-blue-600 text-white px-4 py-2 rounded-xl">
Edit
</button>

<button onclick="deleteBook(${index})"
class="bg-red-600 text-white px-4 py-2 rounded-xl">
Delete
</button>

</div>

</div>

`).join('');

updateDashboard();

}

function exportBackup(){

const blob = new Blob(
[JSON.stringify(books,null,2)],
{type:'application/json'}
);

const a = document.createElement('a');

a.href = URL.createObjectURL(blob);

a.download = 'library-backup.json';

a.click();

}

function importBackup(event){

const file = event.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(e){

try{

books = JSON.parse(e.target.result);

saveBooks();

renderBooks();

alert('Backup imported successfully');

}catch{

alert('Invalid backup file');

}

};

reader.readAsText(file);

}

renderBooks();

</script>

</body>
</html>
